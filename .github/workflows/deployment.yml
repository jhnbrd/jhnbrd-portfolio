name: Deploy Environment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  id-token: write

jobs:
  deployment:
    name: Track Production Deployment
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://jhnbrd.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Register Active Production Deployment
        run: |
          echo "=========================================="
          echo "  PRODUCTION DEPLOYMENT ACTIVE"
          echo "  Primary URL:    https://jhnbrd.com"
          echo "  Tunnel Gateway: https://dev.jhnbrd.com"
          echo "  Host:           Self-Hosted Homelab Laptop"
          echo "  Port:           8000"
          echo "=========================================="
